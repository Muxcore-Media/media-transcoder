name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  GOPRIVATE: github.com/Muxcore-Media/*
jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core dependency
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
      - name: Prepare workspace layout
        run: |
          mkdir -p media-transcoder
          shopt -s dotglob
          for item in *; do
            case "$item" in core|media-transcoder) continue ;; esac
            mv "$item" media-transcoder/
          done
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-transcoder
        run: go vet ./...

  test:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core dependency
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
      - name: Prepare workspace layout
        run: |
          mkdir -p media-transcoder
          shopt -s dotglob
          for item in *; do
            case "$item" in core|media-transcoder) continue ;; esac
            mv "$item" media-transcoder/
          done
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-transcoder
        run: go test -count=1 -timeout 10m ./...

  build:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core dependency
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
      - name: Prepare workspace layout
        run: |
          mkdir -p media-transcoder
          shopt -s dotglob
          for item in *; do
            case "$item" in core|media-transcoder) continue ;; esac
            mv "$item" media-transcoder/
          done
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-transcoder
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
